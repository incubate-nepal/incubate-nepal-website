<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links | Incubate Nepal</title>

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon/favicon-32x32.webp"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon/favicon-16x16.webp"
    />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <meta
      name="msapplication-config"
      content="/assets/favicon/browserconfig.xml"
    />
    <meta name="msapplication-TileColor" content="#ffffff" />

    <!-- css -->
    <!-- Compiled and minified CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
    <link rel="stylesheet" href="/css/main_style.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #000000;
        color: #ffffff;
        text-align: center;
      }
      h6 {
        font-size: 0.9rem;
        color: #ffffff;
      }
      footer {
        margin-top: 2rem;
        font-size: 0.9rem;
        color: #6c757d;
      }
    </style>
  </head>
  <body>
    <div id="contact" class="social-section scrollspy">
      <div
        class="section-title"
        style="padding: 2%; margin-bottom: 0%; margin-top: 2%"
      >
        <h4>Incubate Nepal's Linktree</h4>
        <br />
        <h6>
          Incubate Nepal is an 8-week virtual program that connects students
          from all over Nepal to collaborate on open-ended projects.
        </h6>
        <div class="title-design-shape"></div>
      </div>
      <div class="row">
        <div class="social-info-btn">
          <div class="container" id="links-container">
          </div>
        </div>
      </div>
    </div>

    <footer>&copy; 2025 Incubate Nepal. All rights reserved.</footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
      const csvUrl =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTSX_uwv3s8-AoyjsLe6WapoOQTBcqA2VX8ILLYeEqh1-rYxm6JPtqC9IVZdR1ollIDWpTJ1vrEseGX/pub?output=csv";

      Papa.parse(csvUrl, {
        download: true,
        header: true,
        complete: function (results) {
          const data = results.data;
          const container = document.getElementById("links-container");
          data.forEach((link) => {
            const a = document.createElement("a");
            a.href = link.URL;
            a.target = "_blank";
            a.textContent = link["Link Text"];
            a.className = "waves-effect waves-light social-btn";
            container.appendChild(a);
            container.appendChild(document.createElement("br"));
          });
        },
      });
    </script>
  </body>
</html>
